[package]
name = "witchy-fi-playa"
version = "0.8.0"
edition = "2024"
description = "A simple music player for the couch: runs inside YASAFF and is played with a game controller"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
gilrs = "0.11.2"
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.9"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
